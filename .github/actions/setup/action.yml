name: setup
description: Node, pnpm and one workspace install including the Vue layer.

runs:
  using: composite
  steps:
    # Installs the pnpm version pinned in the root `packageManager`, and puts
    # it on PATH before setup-node, which needs it to read the pnpm store.
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

    - uses: actions/setup-node@v4
      with:
        # .nvmrc is the version of record. oxlint needs at least 22.18 to
        # read a TypeScript config, which every value there clears.
        node-version-file: .nvmrc
        cache: pnpm
        # Each workspace project retains its own dependency resolutions.
        cache-dependency-path: |
          pnpm-lock.yaml
          packages/*/pnpm-lock.yaml
          packages/*/frontend-vue/pnpm-lock.yaml

    # Includes root tooling, interface, backend and Vue; excludes playground.
    - run: pnpm install --frozen-lockfile
      shell: bash
    # The module compiles against the interface's declarations.
    - run: pnpm --dir packages/interface-dms-mailing build
      shell: bash
