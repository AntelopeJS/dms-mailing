name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks the pull requests on top of one
  # another, and filtering on `main` left every intermediate step without a
  # single gate -- only the secret scanner ran.
  pull_request:

  workflow_dispatch: null
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks run as parallel jobs: a pull request waits for the slowest one,
# not for their sum.
jobs:
  # Typecheck, lint, format, knip, the Vue layer tests, size, suppressions and sync.
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    with:
      docs-files: |
        README.md
        docs
        packages/dms-mailing/README.md
        packages/dms-mailing/docs
        packages/interface-dms-mailing/README.md
        packages/interface-dms-mailing/docs
      docs-typescript-project: packages/interface-dms-mailing/docs/tsconfig.json
      renovate-sync: false
      test-job: true
      windows: true
    permissions:
      contents: read

  backend-tests:
    name: backend-tests${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # Package scripts are POSIX shell; pnpm runs them with cmd.exe unless told otherwise.
      - if: runner.os == 'Windows'
        run: |
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The harness resolves the DMS stack's npm modules into this folder
      # (`cacheFolder` in src/test/antelope.test.ts) and asks the registry for
      # the newest version in range on every run; it falls back to the cached
      # version only when the registry does not answer. A cached module keeps
      # the dependencies it was installed with, so a lockfile change starts a
      # fresh install. Between lockfile changes each run restores the newest
      # cache and saves its own, so it downloads only what was published since.
      - uses: actions/cache@v4
        with:
          path: packages/dms-mailing/.antelope/cache
          key: antelope-${{ runner.os }}-${{ hashFiles('packages/dms-mailing/src/test/antelope-modules.ts', 'packages/*/pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: antelope-${{ runner.os }}-${{ hashFiles('packages/dms-mailing/src/test/antelope-modules.ts', 'packages/*/pnpm-lock.yaml') }}-
      # mongodb-memory-server downloads mongod on first use; keyed on the
      # version the test config pins.
      - id: mongo
        run: echo "version=$(grep -oP 'MONGO_BINARY_VERSION = "\K[^"]+' packages/dms-mailing/src/test/antelope.test.ts)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ steps.mongo.outputs.version }}
      - run: pnpm --dir packages/dms-mailing build
      # Built once above: DMS_PREBUILT keeps both the script and the harness's
      # install command from building the module again.
      - run: pnpm --dir packages/dms-mailing test:backend
        env:
          DMS_PREBUILT: "1"
      # The harness installs a module version from its lock in antelope-lock/
      # and records one when there is none, as after a Renovate bump. A
      # recorded lock means this run resolved the module's dependencies fresh.
      - name: Module locks are committed
        id: locks
        if: ${{ !cancelled() }}
        run: |
          changes=$(git status --porcelain -- packages/dms-mailing/antelope-lock)
          if [ -n "$changes" ]; then
            echo "recorded=true" >> "$GITHUB_OUTPUT"
            echo "$changes"
            echo "::error::The backend tests recorded module locks that are not committed: run pnpm --dir packages/dms-mailing test:backend and commit packages/dms-mailing/antelope-lock/, deleting the lock of any version it replaces. On a Renovate pull request the module-locks job commits them."
            exit 1
          fi
      - if: ${{ !cancelled() && runner.os == 'Linux' && steps.locks.outputs.recorded == 'true' && startsWith(github.head_ref, 'renovate/') }}
        uses: actions/upload-artifact@v4
        with:
          name: antelope-lock
          path: packages/dms-mailing/antelope-lock
          include-hidden-files: true
          overwrite: true
          retention-days: 1
    outputs:
      locks-recorded: ${{ steps.locks.outputs.recorded }}

  # A Renovate bump of the DMS test stack records the new versions' locks in
  # the backend-tests run above. This job commits them to the Renovate branch,
  # deletes the locks of the versions they replace, and runs ci again on the
  # new commit, since a push with the workflow token starts no workflow.
  module-locks:
    if: >-
      !cancelled() && needs.backend-tests.outputs.locks-recorded == 'true' && github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    needs: [backend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    concurrency:
      group: module-locks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: antelope-lock
          path: packages/dms-mailing/antelope-lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node packages/dms-mailing/scripts/check-module-locks.mts --prune
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- packages/dms-mailing/antelope-lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --no-verify -q -m "build(test): record the module locks of the bumped DMS test stack"
          git push --no-verify -q "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/${HEAD_REF}"
          gh workflow run ci.yml --ref "$HEAD_REF" > /dev/null

  # Branch protection requires the check of the single job this workflow used
  # to have: it now stands for all of them, and fails if any did not pass.
  ubuntu:
    if: always()
    needs: [ci, backend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
