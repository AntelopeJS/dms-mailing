name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [next]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks run as parallel jobs: a pull request waits for the slowest one,
# not for their sum.
jobs:
  # Typecheck, lint, format, knip, the Vue layer tests, size, suppressions and sync.
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      docs-files: |
        README.md
        docs
        packages/dms-mailing/README.md
        packages/dms-mailing/docs
        packages/interface-dms-mailing/README.md
        packages/interface-dms-mailing/docs
      docs-typescript-project: packages/interface-dms-mailing/docs/tsconfig.json
      renovate-sync: false
      test-job: true
    permissions:
      contents: read

  # ci-node.yml exposes no outputs, so this copies its tier rule for the jobs
  # declared here: a draft and the next to main pull request run none of them,
  # and only the nightly run adds Windows. The e2e suite runs its @smoke
  # journeys on a pull request and every journey, in shards, in the merge
  # queue, nightly, on a manual run and on a pull request labelled ci:full.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      os: ${{ steps.tier.outputs.os }}
      e2e: ${{ steps.tier.outputs.e2e }}
      shards: ${{ steps.tier.outputs.shards }}
    steps:
      - name: Pick the tier with the shared rule
        id: pick
        uses: AntelopeJS/.github/.github/actions/ci-tier@v2
      - name: Pick the tier from the event, the target branch and the draft flag
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          TIER: ${{ steps.pick.outputs.tier }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          tier="$TIER"

          e2e=none
          shards='[1]'
          if [[ "$tier" != none && "$tier" != draft ]]; then
            if [[ "$EVENT" == pull_request && "$FULL_LABEL" != true ]] || [[ "$EVENT" == push ]]; then
              e2e=smoke
            else
              e2e=all
              shards='[1, 2]'
            fi
          fi

          os='["ubuntu-latest"]'
          if [[ "$tier" == nightly ]]; then
            os='["ubuntu-latest","windows-latest"]'
          fi

          {
            echo "tier=${tier}"
            echo "os=${os}"
            echo "e2e=${e2e}"
            echo "shards=${shards}"
          } >> "$GITHUB_OUTPUT"
          echo "Tier \`${tier}\`, e2e \`${e2e}\`" >> "$GITHUB_STEP_SUMMARY"

  backend-tests:
    name: backend-tests${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    needs: select
    if: needs.select.outputs.tier != 'draft' && needs.select.outputs.tier != 'none'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
    defaults:
      run:
        shell: bash
    steps:
      # Package scripts are POSIX shell; pnpm runs them with cmd.exe unless told otherwise.
      - if: runner.os == 'Windows'
        run: |
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The harness resolves the DMS stack's npm modules into this folder
      # (`cacheFolder` in src/test/antelope.test.ts) and asks the registry for
      # the newest version in range on every run; it falls back to the cached
      # version only when the registry does not answer. A cached module keeps
      # the dependencies it was installed with, so a lockfile change starts a
      # fresh install. Between lockfile changes each run restores the newest
      # cache and saves its own, so it downloads only what was published since.
      - uses: actions/cache@v4
        with:
          path: packages/dms-mailing/.antelope/cache
          key: antelope-${{ runner.os }}-${{ hashFiles('packages/dms-mailing/src/test/antelope-modules.ts', 'packages/*/pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: antelope-${{ runner.os }}-${{ hashFiles('packages/dms-mailing/src/test/antelope-modules.ts', 'packages/*/pnpm-lock.yaml') }}-
      # mongodb-memory-server downloads mongod on first use; keyed on the
      # version the test config pins.
      - id: mongo
        run: echo "version=$(grep -oP 'MONGO_BINARY_VERSION = "\K[^"]+' packages/dms-mailing/src/test/antelope.test.ts)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ steps.mongo.outputs.version }}
      - run: pnpm --dir packages/dms-mailing build
      # Built once above: DMS_PREBUILT keeps both the script and the harness's
      # install command from building the module again.
      - run: pnpm --dir packages/dms-mailing test:backend
        env:
          DMS_PREBUILT: "1"
      # The harness installs a module version from its lock in antelope-lock/
      # and records one when there is none, as after a Renovate bump. A
      # recorded lock means this run resolved the module's dependencies fresh.
      # Only the Linux leg uploads the locks, so only it sets the output that
      # starts module-locks; a lock recorded on Windows alone fails that leg.
      - name: Module locks are committed
        id: locks
        if: ${{ !cancelled() }}
        run: |
          changes=$(git status --porcelain -- packages/dms-mailing/antelope-lock)
          if [ -n "$changes" ]; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              echo "recorded=true" >> "$GITHUB_OUTPUT"
            fi
            echo "$changes"
            echo "::error::The backend tests recorded module locks that are not committed: run pnpm --dir packages/dms-mailing test:backend and commit packages/dms-mailing/antelope-lock/, deleting the lock of any version it replaces. On a Renovate pull request the module-locks job commits them."
            exit 1
          fi
      - if: ${{ !cancelled() && runner.os == 'Linux' && steps.locks.outputs.recorded == 'true' && startsWith(github.head_ref, 'renovate/') }}
        uses: actions/upload-artifact@v4
        with:
          name: antelope-lock
          path: packages/dms-mailing/antelope-lock
          include-hidden-files: true
          overwrite: true
          retention-days: 1
    outputs:
      locks-recorded: ${{ steps.locks.outputs.recorded }}

  # A Renovate bump of the DMS test stack records the new versions' locks in
  # the backend-tests run above. This job commits them to the Renovate branch,
  # deletes the locks of the versions they replace, and runs ci again on the
  # new commit, since a push with the workflow token starts no workflow.
  module-locks:
    if: >-
      !cancelled() && needs.backend-tests.outputs.locks-recorded == 'true' && github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    needs: [backend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    concurrency:
      group: module-locks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: antelope-lock
          path: packages/dms-mailing/antelope-lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node packages/dms-mailing/scripts/check-module-locks.mts --prune
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- packages/dms-mailing/antelope-lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --no-verify -q -m "build(test): record the module locks of the bumped DMS test stack"
          git push --no-verify -q "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/${HEAD_REF}"
          gh workflow run ci.yml --ref "$HEAD_REF" > /dev/null

  # The journeys of e2e/ as a Playwright suite, as select picks them: the
  # @smoke ones, or every journey in shards. Its global setup prepares and
  # starts one dms-control run per shard.
  e2e:
    needs: select
    if: needs.select.outputs.e2e != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    env:
      E2E: ${{ needs.select.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: echo "DMS_CONTROL_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
            .agents/skills/verify-dms-mailing/playground/.antelope/cache
          key: e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.agents/skills/verify-dms-mailing/deps/pnpm-lock.yaml', '.agents/skills/verify-dms-mailing/playground/antelope.config.ts') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/dms-control/frontend
          key: dms-control-frontend-${{ github.sha }}
          restore-keys: dms-control-frontend-
      - name: Install Chromium and its system packages
        run: |
          if timeout 240 pnpm exec playwright install --with-deps --only-shell chromium; then
            exit 0
          fi
          echo "::warning::Chromium's system packages did not install: installing the browser alone"
          pnpm exec playwright install --only-shell chromium
      - if: env.E2E == 'smoke'
        run: pnpm e2e --grep @smoke
      - if: env.E2E == 'all'
        run: pnpm e2e --shard=${{ matrix.shard }}/2 --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: e2e/blob-report
      # The suite's two entry files against the declarations @antelopejs/dms/e2e publishes.
      - if: success() || failure()
        run: pnpm exec tsc --noEmit -p e2e
      - if: always() && env.E2E == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  # One HTML and JSON report of the shards.
  e2e-report:
    needs: [select, e2e]
    if: always() && needs.select.outputs.e2e == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: e2e/blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html,json e2e/blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/playwright-report/results.json
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # Branch protection requires the check of the single job this workflow used
  # to have: it now stands for all of them, and fails if any did not pass.
  # backend-tests may be skipped only on a tier that does not run it, and e2e
  # only when select picked none of its journeys. A draft pull request fails it,
  # so merge-when-green cannot merge on the draft run.
  ubuntu:
    if: always()
    needs: [select, ci, backend-tests, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: >-
          needs.select.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || (needs.backend-tests.result == 'skipped' && needs.select.outputs.tier != 'draft' && needs.select.outputs.tier != 'none') || (needs.select.outputs.e2e != 'none' && needs.e2e.result == 'skipped')
        run: exit 1
      - if: needs.select.outputs.tier == 'draft'
        run: |
          echo "::error::Draft pull request: only lint and typecheck ran. Mark it ready for review to run the tests."
          exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
