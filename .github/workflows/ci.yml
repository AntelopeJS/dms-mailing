name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks the pull requests on top of one
  # another, and filtering on `main` left every intermediate step without a
  # single gate -- only the secret scanner ran.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in the root `packageManager`, and puts
      # it on PATH before setup-node, which needs it to read the pnpm store.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the version of record. oxlint needs at least 22.18 to
          # read a TypeScript config, which every value there clears.
          node-version-file: .nvmrc
          cache: pnpm
          # The workspace lockfile is at the root; the packages have none.
          cache-dependency-path: pnpm-lock.yaml

      # `...` pulls in the workspace interface package the module depends on,
      # and nothing else: the playground and the Vue layer are separate
      # projects with their own lockfiles. pnpm installs the workspace root
      # alongside the selection, which the packages' lint configs need: they
      # import the shared config at the root, whose own `oxlint` and
      # `@antelopejs/tooling-configs` imports resolve from the root.
      - run: pnpm install --filter @antelopejs/dms-mailing... --frozen-lockfile
      - run: pnpm --dir packages/dms-mailing/frontend-vue install --frozen-lockfile
      - run: pnpm --dir packages/interface-dms-mailing lint
      - run: pnpm --dir packages/interface-dms-mailing typecheck
      - run: pnpm --dir packages/interface-dms-mailing build
      # Packs the interface and compiles a consumer against the tarball under
      # the three resolvers with `skipLibCheck: false`: the exports map and
      # `typesVersions` are a published contract no other gate exercises.
      - run: pnpm --dir packages/interface-dms-mailing check:consumer
      - run: pnpm --dir packages/dms-mailing lint
      # tsconfig.json is the config the editors and oxlint's type-aware pass
      # read; tsconfig.build.json is the one the build uses. Without this the
      # first is never exercised, and a resolution failure there degrades every
      # type-aware rule to `any` without failing anything.
      - run: pnpm --dir packages/dms-mailing typecheck
      # Unused dependencies only. `pnpm knip:all` also reports dead files and
      # exports, which need a human to confirm, so they stay out of the gate.
      - run: pnpm --dir packages/dms-mailing knip
      - run: pnpm --dir packages/dms-mailing build
      - run: pnpm --dir packages/dms-mailing test
      - run: pnpm --dir packages/dms-mailing test:frontend
