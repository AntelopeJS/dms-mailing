name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly tier, with the Windows jobs and Stress
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks run as parallel jobs: a pull request waits for the slowest one,
# not for their sum.
jobs:
  # Typecheck, lint, format, knip, the Vue layer tests, size, suppressions and sync.
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      docs-files: |
        README.md
        docs
        packages/dms-mailing/README.md
        packages/dms-mailing/docs
        packages/interface-dms-mailing/README.md
        packages/interface-dms-mailing/docs
      docs-typescript-project: packages/interface-dms-mailing/docs/tsconfig.json
      renovate-sync: false
      test-job: true
      module-locks: true
      windows-merge-queue: true
      nightly: ${{ inputs.nightly == true }}
      formal-checks: |
        [
          {"skill": "formal-dms-mailing", "paths": ["packages/dms-mailing/src/crons/retention.ts", "packages/dms-mailing/src/db/models/send-events.model.ts", "packages/dms-mailing/src/db/models/sends.model.ts", "packages/dms-mailing/src/services/events.ts", "packages/dms-mailing/src/services/send-import.ts", "packages/dms-mailing/src/types/sends.ts"]},
          {"skill": "formal-template-slugs"}
        ]
    permissions:
      contents: read

  # ci-node.yml exposes no outputs, so this copies its tier rule for the jobs
  # declared here: a push to main runs none of them, and only the nightly run
  # adds Windows. The e2e suite runs its @smoke
  # journeys on a pull request and every journey, in shards, in the merge
  # queue, nightly, on a manual run and on a pull request labelled ci:full.
  select:
    runs-on: ${{ vars.RUNNER_CI || (github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404') }}
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      e2e: ${{ steps.tier.outputs.e2e }}
      shards: ${{ steps.tier.outputs.shards }}
    steps:
      - name: Pick the tier with the shared rule
        id: pick
        uses: AntelopeJS/.github/.github/actions/ci-tier@v2
      - name: Pick the tier from the event, the target branch and the draft flag
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          TIER: ${{ steps.pick.outputs.tier }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          tier="$TIER"

          e2e=none
          shards='[1]'
          if [[ "$tier" != none && "$tier" != draft ]]; then
            if [[ "$EVENT" == pull_request && "$FULL_LABEL" != true ]] || [[ "$EVENT" == push ]]; then
              e2e=smoke
            else
              e2e=all
              shards='[1, 2, 3]'
            fi
          fi

          {
            echo "tier=${tier}"
            echo "e2e=${e2e}"
            echo "shards=${shards}"
          } >> "$GITHUB_OUTPUT"
          echo "Tier \`${tier}\`, e2e \`${e2e}\`" >> "$GITHUB_STEP_SUMMARY"

  backend-tests:
    needs: select
    if: needs.select.outputs.tier != 'draft' && needs.select.outputs.tier != 'none'
    runs-on: ${{ vars.RUNNER_CI || (github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/backend-tests

  backend-tests-windows:
    name: backend-tests on Windows
    needs: select
    if: needs.select.outputs.tier == 'nightly'
    runs-on: ${{ vars.RUNNER_CI_WINDOWS || (github.event.repository.visibility == 'public' && 'windows-latest' || 'blacksmith-4vcpu-windows-2025') }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Package scripts are POSIX shell; pnpm runs them with cmd.exe unless told otherwise.
      - run: |
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/backend-tests

  module-locks:
    needs: [ci, backend-tests, backend-tests-windows]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: AntelopeJS/.github/.github/workflows/module-locks-renovate.yml@v2
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # The journeys of e2e/ as a Playwright suite, as select picks them: the
  # @smoke ones, or every journey in shards. `pnpm e2e:build` builds the module
  # and the playground; the kit's global setup then starts one run per shard.
  e2e:
    needs: select
    if: needs.select.outputs.e2e != 'none'
    runs-on: ${{ vars.RUNNER_CI || (github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    env:
      E2E: ${{ needs.select.outputs.e2e }}
      DMS_E2E_PREBUILT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          echo "DMS_E2E_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
            e2e/playground/.antelope/cache
          key: e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'e2e/playground-deps/pnpm-lock.yaml', 'e2e/playground/antelope.config.ts') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/dms-e2e/frontend
          key: e2e-frontend-v2-${{ github.sha }}
          restore-keys: e2e-frontend-v2-
      - name: Install Chromium and its system packages
        run: |
          if timeout 240 pnpm exec playwright install --with-deps --only-shell chromium; then
            exit 0
          fi
          echo "::warning::Chromium's system packages did not install: installing the browser alone"
          pnpm exec playwright install --only-shell chromium
      - run: pnpm e2e:build
      - if: env.E2E == 'smoke'
        run: pnpm e2e --grep @smoke
      - if: env.E2E == 'all'
        run: pnpm e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: e2e/blob-report
      # The suite's two entry files against the declarations @antelopejs/dms/e2e publishes.
      - if: success() || failure()
        run: pnpm exec tsc --noEmit -p e2e
      - if: always() && env.E2E == 'all'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  # One HTML and JSON report of the shards.
  e2e-report:
    needs: [select, e2e]
    if: always() && needs.select.outputs.e2e == 'all'
    runs-on: ${{ vars.RUNNER_CI || (github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: e2e/blob-reports
          merge-multiple: true
      - run: |
          version=$(sed -n "s/^  playwright@\([0-9.]*\):$/\1/p" pnpm-lock.yaml | head -n 1)
          npx --yes "playwright@${version}" merge-reports --reporter html,json e2e/blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/playwright-report/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # Branch protection requires the check of the single job this workflow used
  # to have: it now stands for all of them, and fails if any did not pass.
  # backend-tests may be skipped only on a tier that does not run it, and e2e
  # only when select picked none of its journeys. A draft pull request fails it,
  # so merge-when-green cannot merge on the draft run.
  ubuntu:
    if: always()
    needs: [select, ci, backend-tests, backend-tests-windows, e2e, e2e-report]
    runs-on: ${{ vars.RUNNER_CI || (github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404') }}
    timeout-minutes: 5
    steps:
      - if: >-
          needs.select.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || (needs.backend-tests.result == 'skipped' && needs.select.outputs.tier != 'draft' && needs.select.outputs.tier != 'none') || (needs.select.outputs.e2e != 'none' && needs.e2e.result == 'skipped')
        run: exit 1
      - if: needs.select.outputs.tier == 'draft'
        run: |
          echo "::error::Draft pull request: only lint and typecheck ran. Mark it ready for review to run the tests."
          exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
  verdict:
    needs:
      - ci
      - select
      - backend-tests
      - backend-tests-windows
      - module-locks
      - e2e
      - e2e-report
      - ubuntu
      - renovate-sync
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.RUNNER_CI || (github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404') }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
