name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks the pull requests on top of one
  # another, and filtering on `main` left every intermediate step without a
  # single gate -- only the secret scanner ran.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks run as parallel jobs: a pull request waits for the slowest one,
# not for their sum.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --dir packages/interface-dms-mailing lint
      # Also lints the Vue layer.
      - run: pnpm --dir packages/dms-mailing lint
      # Unused dependencies only. `pnpm knip:all` also reports dead files and
      # exports, which need a human to confirm, so they stay out of the gate.
      - run: pnpm --dir packages/dms-mailing knip

  build-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Builds the interface, which also typechecks it.
      - uses: ./.github/actions/setup
      - uses: AntelopeJS/tooling-configs/actions/docs@310e3d861b2da2244902854379176c91e1ebc68e
        with:
          files: |
            README.md
            packages/dms-mailing/README.md
            packages/dms-mailing/docs
            packages/interface-dms-mailing/README.md
            packages/interface-dms-mailing/docs
          typescript-project: packages/interface-dms-mailing/docs/tsconfig.json
      # oxlint's type-aware pass degrades to `any` on a broken tsconfig
      # without failing, so a typecheck is what catches it. The build compiles
      # the same tsconfig as `typecheck`, so it is that typecheck.
      - run: pnpm --dir packages/dms-mailing build

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The harness resolves the DMS stack's npm modules into this folder
      # (`cacheFolder` in src/test/antelope.test.ts). It checks the registry
      # for newer versions on every run, so a stale cache only costs a
      # download, never an old module.
      - uses: actions/cache@v4
        with:
          path: packages/dms-mailing/.antelope/cache
          key: antelope-${{ runner.os }}-${{ hashFiles('packages/dms-mailing/src/test/antelope-modules.ts', 'pnpm-lock.yaml') }}
      # mongodb-memory-server downloads mongod on first use; keyed on the
      # version the test config pins.
      - id: mongo
        run: echo "version=$(grep -oP 'MONGO_BINARY_VERSION = "\K[^"]+' packages/dms-mailing/src/test/antelope.test.ts)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ steps.mongo.outputs.version }}
      - run: pnpm --dir packages/dms-mailing build
      # Built once above: DMS_PREBUILT keeps both the script and the harness's
      # install command from building the module again.
      - run: pnpm --dir packages/dms-mailing test:backend
        env:
          DMS_PREBUILT: "1"

  layer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --dir packages/dms-mailing test:layer

  # Branch protection requires the check of the single job this workflow used
  # to have: it now stands for all of them, and fails if any did not pass.
  ubuntu:
    if: always()
    needs: [lint, build-types, backend-tests, layer-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
