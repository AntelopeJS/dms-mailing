packages:
  - packages/*
  - packages/*/frontend-vue

# pnpm ignores the `pnpm` field of package.json once a workspace file exists.
onlyBuiltDependencies:
  - mongodb-memory-server-core
  - esbuild
allowBuilds:
  lefthook: false
  mongodb-memory-server: false
minimumReleaseAgeExclude:
  - "@antelopejs/interface-*"
overrides:
  "@antelopejs/interface-dms": 0.16.1-next.1038.g5226a6a
