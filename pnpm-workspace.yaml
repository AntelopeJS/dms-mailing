packages:
  - packages/*
  - packages/*/frontend-vue

# pnpm ignores the `pnpm` field of package.json once a workspace file exists.
onlyBuiltDependencies:
  - mongodb-memory-server-core
  - esbuild
# Paths resolve from packages/dms-mailing, the one workspace package that installs the mongodb tarball.
overrides:
  "@antelopejs/mongodb>@antelopejs/interface-database": "file:../../.campaign/tgz/antelopejs-interface-database-4939b45.tgz"
